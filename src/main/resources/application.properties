spring.application.name=Ejemplo

# Base de datos de la practica (crear BDParcialEjemplo en pgAdmin)
# Los datos sensibles se leen de variables de entorno; los valores tras ":" son solo de desarrollo
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/BDParcialEjemplo}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Seguridad: clave del token (minimo 32 caracteres) y password del usuario operator
jwt.secret=${JWT_SECRET:clave_de_desarrollo_cambiar_en_produccion_123456}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.codigo-alumno=${APP_CODIGO_ALUMNO:00000000}

server.port=${SERVER_PORT:8080}
